name: Deploy to GitHub Pages
on:
  push:
    branches:
      - christ
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  
concurrency:
  group: 'pages'
  cancel-in-progress: false
  
jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/setup-node@v3
              with:
                node-version: '20'
                cache: 'pnpm'
            - name: Install deps
              run: npm install
            - name: Build with Vite
              run: npx vite build
              
              env:
                VITE_BASE: /Info-Univers/
              
            - name: upload artifact
              uses: actions/upload-pages-artifact@v1
              with:
                path: './dist'
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4          